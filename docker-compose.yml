# BillMind 2.0 — production stack: Postgres + Vapor server + Caddy (auto-HTTPS).
#
#   cp .env.example .env   # then fill in secrets + domains
#   docker compose up -d --build
#
# Caddy terminates TLS and reverse-proxies the API. The web client deploys as
# static files (build with `cd web && npm run build`, then the dist/ is mounted
# into Caddy — see the `web` site block in Caddyfile).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connection string built from the db service.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_MODERATION_KEY: ${OPENAI_MODERATION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
  web:
