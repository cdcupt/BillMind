<!doctype html><html><head><meta charset=utf-8><style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#F7F4EE;font-family:'Inter',system-ui,sans-serif;color:#1B201D;padding:40px;display:flex;gap:34px;justify-content:center;flex-wrap:wrap}
    .col{width:300px;text-align:center}
    .tile{width:240px;height:240px;border-radius:54px;overflow:hidden;margin:0 auto 14px;box-shadow:0 12px 30px rgba(27,32,29,.18)}
    .tile img{width:100%;height:100%;display:block}
    h3{font-family:Georgia,serif;font-size:20px;margin-bottom:4px}
    p{font-size:13px;color:#5f655f;line-height:1.45}
    .tag{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C8643C}
  </style></head><body>
  <div class=col><div class=tile><img src='concept-a.png'></div><div class=tag>Concept A</div><h3>The talking receipt</h3><p>A receipt whose 'bottom line' is an AI spark. Agent + bill, pine.</p></div>
  <div class=col><div class=tile><img src='concept-b.png'></div><div class=tag>Concept B</div><h3>Receipt + spark</h3><p>A clean white receipt with an AI sparkle. Bill-forward, warm.</p></div>
  <div class=col><div class=tile><img src='concept-c.png'></div><div class=tag>Concept C</div><h3>Mochi + AI</h3><p>The mascot kept, with an AI spark. Brand continuity.</p></div>
  </body></html>
