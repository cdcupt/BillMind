name: BillMind
options:
  bundleIdPrefix: com.billmind
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0

targets:
  BillMind:
    type: application
    platform: iOS
    sources:
      - BillMind
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: BillMind/BillMind.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        INFOPLIST_FILE: BillMind/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "BillOwl needs camera access to scan bills and invoices"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BillOwl needs photo library access to import bill images"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BillOwl listens so you can add bills by voice"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "BillOwl transcribes your voice to turn it into bills"
        INFOPLIST_KEY_CFBundleDisplayName: BillOwl
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: 3
        PRODUCT_BUNDLE_IDENTIFIER: com.billmind.app
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: BillMind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  BillMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BillMind
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BillMind.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BillMind"

  BillMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BillMind
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BillMind

schemes:
  BillMind:
    build:
      targets:
        BillMind: all
    test:
      targets:
        - BillMindTests
        - BillMindUITests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
