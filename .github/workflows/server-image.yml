name: server-image

# Builds the Vapor server image on CI (the BWH box is too RAM-tight to build
# Swift safely) and publishes it to GHCR. The box then just pulls + runs it.
# Build context is the repo root because the package depends on
# ../shared/BillMindCore via a local path.

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/billmind-2-server"]
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/server-image.yml"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/cdcupt/billmind-server:latest
            ghcr.io/cdcupt/billmind-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
